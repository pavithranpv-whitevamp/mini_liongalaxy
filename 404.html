<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Page not found | Mini Lion Galaxy</title>
  <meta name="theme-color" content="#120c35">
  <style>
    /* Self-contained so it works at any address, even deep ones. */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; text-align: center;
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff8e7;
      background: radial-gradient(ellipse at 50% 30%, #2a1d6e 0%, #120c35 70%);
    }
    .lost { font-size: 5rem; line-height: 1; margin-bottom: 12px; }
    h1 { font-family: "Baloo 2", "Comic Sans MS", system-ui, sans-serif; font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.1; margin: 0 0 10px; color: #ffc72c; }
    p { margin: 0 0 28px; color: #cfc6f5; font-size: 1.1rem; }
    .btn {
      display: inline-block; text-decoration: none; font-weight: 800; font-size: 1.15rem;
      background: #ffc72c; color: #120c35; padding: 14px 28px; border-radius: 999px;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
    }
    .btn:focus-visible { outline: 4px solid #3ec6f0; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="lost" aria-hidden="true">🦁🪐</div>
    <h1>Oops! Lost in space</h1>
    <p>This page floated away. Let's fly back home.</p>
    <a class="btn" href="/">🚀 Back to Mini Lion Galaxy</a>
  </main>
</body>
</html>
